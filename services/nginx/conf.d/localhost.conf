server {
    listen        80;
    server_name  localhost;
    root   "/data/www/ttxn_api/public";

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    error_log  /var/log/nginx/nginx.localhost.error.log  warn;
    index index.html index.htm index.php;

    charset utf-8;

    #反向代理 需要把后续.php 相关的和重写 index.php 的部分删除
    location ^~ /ws/ {
        proxy_redirect off;
        proxy_pass http://php:9909; #转发到你本地的 9909 端口 对应 ws 的端口
        proxy_set_header Host $host;
        proxy_set_header X-Real_IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr:$remote_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
    }

    location / {
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
        }
    }

   location ^~ /dist {

        try_files $uri $uri/ /dist/index.html;
    }
    
    location ^~ /images {
        alias "/data/www/image";
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_pass   php:9000;
        include        fastcgi-php.conf;
        include        fastcgi_params;
    }
}

server{
        listen 84;
        server_name localhost;
        index  index.php index.html index.htm;
        access_log   /var/log/nginx/scrm_admin_access.log;
        error_log    /var/log/nginx/scrm_admin_error.log;
        client_max_body_size 10m; 
        set $root "/data/www/scrm_admin/public";

        root  $root;
        location / {
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            if (!-e $request_filename) {
                rewrite ^(.*)$ /index.php?s=$1 last;
            }
        }
        location ~ \.php(.*)$ {
         fastcgi_pass   php:9000;
         fastcgi_index  index.php;
         fastcgi_param  SCRIPT_FILENAME  $DOCUMENT_ROOT$fastcgi_script_name;
         fastcgi_param PATH_INFO $1;
         fastcgi_param ENVIRONMENT "dev";
         include        fastcgi_params;
     }
    }

